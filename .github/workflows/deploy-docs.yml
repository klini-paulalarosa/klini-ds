name: Deploy Docs — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:       # permite disparar manualmente

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs app
    runs-on: ubuntu-latest
    # Pages so esta habilitado no repo pessoal (klini-paulalarosa).
    # No espelho klini-saude/design-system o job e ignorado graciosamente.
    if: github.repository == 'klini-paulalarosa/klini-ds'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@klini-saude'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build library
        run: npx ng build klini-ds

      - name: Build docs app
        run: npx ng build klini-ds-docs --configuration production --base-href /klini-ds/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/klini-ds-docs/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
