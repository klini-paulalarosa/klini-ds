name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: klini-ds-dist
          path: dist/klini-ds
          retention-days: 7
