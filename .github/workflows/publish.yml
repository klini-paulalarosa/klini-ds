name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'           # dispara em tags como v0.2.0, v1.0.0

jobs:
  publish:
    name: Publish @klini/ds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # necessário para publicar no GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (registry GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@klini'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          npm version $TAG --no-git-tag-version --prefix dist/klini-ds

      - name: Publish
        run: npm publish dist/klini-ds --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
